<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaudeCodeWeb</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">ClaudeCode<span>Web</span></div>

    <button id="btn-new" class="primary">+ 新建对话</button>

    <div class="cfg-btns">
      <button id="btn-agents" class="ghost small" title="管理子 agent">子 agent</button>
      <button id="btn-perms" class="ghost small" title="编辑权限 allow/deny">权限</button>
      <button id="btn-probe" class="ghost small" title="探测各模型是否可用">模型权限</button>
    </div>

    <div class="fields">
      <select id="sel-model" title="模型（新建对话的默认）"></select>
      <input id="inp-cwd" type="text" spellcheck="false" placeholder="工作目录" title="工作目录" />
      <select id="sel-perm" title="权限模式"></select>
    </div>

    <div class="sec-title">当前对话</div>
    <div id="active-list" class="list"></div>

    <div class="sec-title">历史记录</div>
    <div id="history-list" class="list"></div>

    <details class="fold">
      <summary>归档 <span id="archive-count">0</span></summary>
      <div id="archive-list" class="list"></div>
    </details>

    <div class="sec-title">可镜像</div>
    <div id="foreign-list" class="list"></div>


  </aside>

  <main class="main">
    <header class="chat-header">
      <div class="chat-title" id="chat-title">未选择会话</div>
      <div class="chat-meta" id="chat-meta"></div>
    </header>

    <div id="messages" class="messages"></div>

    <div id="cmd-row" class="cmd-row">
      <span>快捷命令：</span>
      <button type="button" class="ghost small" data-cmd="/compact" title="压缩上下文，省 token">压缩上下文</button>
      <button type="button" class="ghost small" data-cmd="/clear" title="清空上下文重新开始">清空</button>
      <button type="button" class="ghost small" data-cmd="/usage" title="查看用量与花费">用量</button>
      <button type="button" class="ghost small" data-cmd="/doctor" title="诊断 CLI 环境">诊断</button>
      <button type="button" class="ghost small" id="btn-plan">进入计划模式</button>
    </div>

    <div id="key-row" class="key-row" hidden>
      <span>快捷按键（镜像 / 原生 TUI）：</span>
      <button type="button" class="ghost small" data-key="Up">↑</button>
      <button type="button" class="ghost small" data-key="Down">↓</button>
      <button type="button" class="ghost small" data-key="Enter">Enter</button>
      <button type="button" class="ghost small" data-key="Escape">Esc</button>
      <button type="button" class="ghost small" data-key="Tab">Tab</button>
      <button type="button" class="ghost small" data-key="y">y</button>
      <button type="button" class="ghost small" data-key="n">n</button>
      <button type="button" class="ghost small" data-key="s" title="/model 选择器里用它＝仅本次会话生效，不改全局默认">s（仅本次）</button>
      <button type="button" class="ghost small" data-key="BTab" title="Shift+Tab：在 TUI 里切换权限模式">Shift+Tab</button>
      <button type="button" class="ghost small" data-key="C-c">Ctrl-C</button>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="2" placeholder="Enter 发送，Shift+Enter 换行" spellcheck="false"></textarea>
      <div class="composer-actions">
        <select id="chat-model" class="chat-model" title="切换当前对话的模型：会转成 /model <名字> 敲进终端"></select>
        <select id="chat-effort" class="chat-model" title="思考强度：转成 /effort <等级> 敲进终端">
          <option value="">effort</option>
          <option value="low">effort: low</option>
          <option value="medium">effort: medium</option>
          <option value="high">effort: high</option>
        </select>
        <button type="button" id="btn-stop" class="ghost">停止</button>
        <button type="submit" id="btn-send" class="primary">发送</button>
      </div>
    </form>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
