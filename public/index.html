<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaudeCodeWeb</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">ClaudeCode<span>Web</span></div>

    <button id="btn-new" class="primary">+ 新建会话（服务内起进程）</button>
    <button id="btn-local" class="ghost">+ 启动本地 tc（tmux，可共享）</button>

    <label class="field">
      <span>模型</span>
      <select id="sel-model"></select>
    </label>

    <label class="field">
      <span>工作目录</span>
      <input id="inp-cwd" type="text" spellcheck="false" />
    </label>

    <label class="field">
      <span>权限模式</span>
      <select id="sel-perm"></select>
    </label>

    <p id="hint" class="hint"></p>

    <div class="sec-title">当前对话（终端 ⇄ Web）</div>
    <div id="active-list" class="list"></div>

    <div class="sec-title">归档（点击审视，打开/删除用条目上的按钮）</div>
    <div id="history-list" class="list"></div>

    <div class="sec-title">tmux 里的其他 tc（可镜像）</div>
    <div id="foreign-list" class="list"></div>

    <div class="sec-title">Web 已接入</div>
    <div id="session-list" class="list"></div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <div class="chat-title" id="chat-title">未选择会话</div>
      <div class="chat-meta" id="chat-meta"></div>
    </header>

    <div id="messages" class="messages"></div>

    <div id="key-row" class="key-row" hidden>
      <span>快捷按键（镜像模式）：</span>
      <button type="button" class="ghost small" data-key="Up">↑</button>
      <button type="button" class="ghost small" data-key="Down">↓</button>
      <button type="button" class="ghost small" data-key="Enter">Enter</button>
      <button type="button" class="ghost small" data-key="Escape">Esc</button>
      <button type="button" class="ghost small" data-key="Tab">Tab</button>
      <button type="button" class="ghost small" data-key="y">y</button>
      <button type="button" class="ghost small" data-key="n">n</button>
      <button type="button" class="ghost small" data-key="C-c">Ctrl-C</button>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="2" placeholder="Enter 发送，Shift+Enter 换行" spellcheck="false"></textarea>
      <div class="composer-actions">
        <button type="button" id="btn-stop" class="ghost">停止</button>
        <button type="submit" id="btn-send" class="primary">发送</button>
      </div>
    </form>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
